<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1080">
<title>MDreieck Campo</title>
<link rel="stylesheet" href="estilos.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<header class="hdr plain">
  <div class="hdr-row">
    <div class="logo" id="brandLogo">MD</div>
    <div class="htxt">
      <h1>MDreieck Campo</h1>
      <div class="sub">Levantamientos de sitio</div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banners"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px">
    <span class="chip" id="countChip">—</span>
    <button class="btn btn-ghost" style="padding:9px 13px;font-size:13px" onclick="abrirModal()">＋ Nuevo</button>
  </div>
  <div class="list" id="list"></div>
</main>

<nav class="navbar">
  <div class="nav-inner">
    <button class="btn btn-primary btn-block" onclick="abrirModal()">＋ Nuevo levantamiento</button>
    <button class="btn btn-ghost btn-block" id="instBtn" style="display:none" onclick="instalar()">📲 Instalar en el teléfono</button>
    <button class="link-test" id="testBtn" onclick="probar()">Probar conexión con Drive</button>
  </div>
</nav>

<div class="overlay" id="ovEdit" onclick="if(event.target===this)cerrarEdit()">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <h2>Editar datos generales</h2>
    <p class="sh-sub" id="editFolio">—</p>

    <div class="field">
      <label>Proyecto</label>
      <input id="e_proyecto" autocomplete="off" style="text-transform:uppercase">
    </div>
    <p class="hint" id="e_folioAviso" style="margin:-6px 0 10px"></p>
    <div class="field">
      <label>Nombre del sitio / localidad</label>
      <input id="e_sitio" autocomplete="off">
    </div>
    <div class="field">
      <label>Nombre de quien captura</label>
      <input id="e_capturado" autocomplete="off">
    </div>
    <div class="field">
      <label>Fecha de captura</label>
      <input id="e_fecha" type="date">
    </div>
    <div class="err" id="eErr"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="cerrarEdit()">Cancelar</button>
      <button class="btn btn-primary" style="flex:1.4" onclick="guardarEdit()">Guardar cambios</button>
    </div>
  </div>
</div>

<div class="overlay" id="ov" onclick="if(event.target===this)cerrarModal()">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <h2>Nuevo levantamiento</h2>
    <p class="sh-sub">Funciona sin internet. El folio se genera al instante.</p>

    <div class="field">
      <label>Proyecto</label>
      <input id="m_proyecto" placeholder="Ej. VERACRUZ" autocomplete="off"
             style="text-transform:uppercase" oninput="previewFolio()">
    </div>
    <div class="folio-prev" id="folioPrev">LEV-XXX-001</div>
    <button class="link-test" id="resetFolioBtn" style="display:none;margin:-6px 0 8px"
      onclick="reiniciar()"></button>

    <div class="field">
      <label>Nombre del sitio / localidad</label>
      <input id="m_sitio" placeholder="Ej. Col. Centro, Poza Rica" autocomplete="off">
    </div>
    <div class="field">
      <label>Nombre de quien captura</label>
      <input id="m_capturado" placeholder="Nombre completo" autocomplete="off">
    </div>
    <div class="field">
      <label>Fecha de captura</label>
      <input id="m_fecha" type="date">
    </div>

    <div class="err" id="mErr"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" style="flex:1.4" onclick="crear()">Crear y continuar</button>
    </div>
  </div>
</div>

<div class="sending" id="sendOv">
  <div class="send-box" id="sendBox">
    <div class="spin"></div>
    <div class="check-ic" id="checkIc">✓</div>
    <h3 id="sendTitle">Procesando…</h3>
    <p id="sendMsg">Un momento.</p>
  </div>
</div>

<script src="app.js"></script>
<script>
function nFotos(l){ return (l.medios||[]).filter(m=>m.kind==='foto').length; }
function nVideos(l){ return (l.medios||[]).filter(m=>m.kind==='video').length; }

function renderBanners(){
  const c=document.getElementById('banners');
  const pend=getLevs().filter(l=>!l.enviado && l.listoParaEnviar).length;
  let h='';
  if(!online()){
    h=`<div class="banner info"><span class="b-ic">📴</span>
      <span>Modo sin conexión. Crea y captura con normalidad: solo el envío a Drive necesita internet.</span></div>`;
  } else if(pend>0){
    h=`<div class="banner pend"><span class="b-ic">🔄</span>
      <span>${pend} ${pend===1?'levantamiento listo':'levantamientos listos'} sin enviar.</span></div>`;
  } else if(!CONFIGURADO){
    h=`<div class="banner info"><span class="b-ic">⚙️</span>
      <span>Falta configurar la URL del Apps Script en app.js. Todo funciona, pero aún no sube a Drive.</span></div>`;
  }
  c.innerHTML=h;
}

function render(){
  renderBanners();
  const levs=getLevs();
  const list=document.getElementById('list');
  document.getElementById('countChip').textContent =
    levs.length+' '+(levs.length===1?'levantamiento':'levantamientos');

  if(!levs.length){
    list.innerHTML=`<div class="empty"><div class="em-ic">📍</div>
      <h3>Sin levantamientos</h3><p>Crea el primero con el botón de abajo.</p></div>`;
    return;
  }
  const orden=levs.slice().sort((a,b)=>(b.creado||'').localeCompare(a.creado||''));
  list.innerHTML=orden.map(l=>{
    const badge = l.enviado ? '<span class="badge badge-sent">✓ Enviado</span>'
      : (l.listoParaEnviar ? '<span class="badge badge-pend">Por enviar</span>'
                           : '<span class="badge badge-cap">En captura</span>');
    return `<div class="item" onclick="abrir('${l.id}')">
      <div class="it-body">
        <div class="it-folio">${esc(l.folio)}</div>
        <div class="it-sitio">${esc(l.sitio||l.proyecto||'—')}</div>
        <div class="it-meta"><span>👤 ${esc(l.capturadoPor||'—')}</span>
          <span>📅 ${fmtFecha(l.fecha)}</span></div>
      </div>
      <div class="it-side">${badge}
        <span class="chip">📷 ${nFotos(l)} · 🎥 ${nVideos(l)}</span></div>
      <div class="it-acciones">
        ${l.enviado ? `<button class="ico-btn" aria-label="Reenviar a Drive"
          onclick="event.stopPropagation(); reenviar('${l.id}')">☁️</button>` : ''}
        <button class="ico-btn" aria-label="Editar"
          onclick="event.stopPropagation(); editar('${l.id}')">✏️</button>
        <button class="ico-btn" aria-label="Eliminar"
          onclick="event.stopPropagation(); borrar('${l.id}')">🗑</button>
      </div>
    </div>`;
  }).join('');
}

async function reenviar(id){
  const l=getLev(id); if(!l) return;
  if(!online()){ alert('Necesitas conexión a internet para reenviar a Drive.'); return; }
  if(!CONFIGURADO){ alert('Falta configurar la URL del Apps Script.'); return; }
  if(!confirm('Reenviar '+l.folio+' a Drive?\n\nÚtil si faltaron fotos. Se vuelve a subir todo a la misma carpeta, reemplazando lo que ya esté; no se duplica.')) return;

  const ov=document.getElementById('sendOv'), box=document.getElementById('sendBox');
  const setMsg=(t,m,estado)=>{
    box.classList.toggle('done',!!estado);
    const ic=document.getElementById('checkIc');
    ic.textContent=estado==='err'?'⚠️':'✓'; ic.style.color=estado==='err'?'#c62828':'#1f9d55';
    document.getElementById('sendTitle').textContent=t;
    document.getElementById('sendMsg').textContent=m;
    ov.classList.add('on');
  };
  try{
    await enviarLev(l, setMsg);
    l.fechaEnvio=new Date().toISOString(); guardarLev(l);
    setMsg('¡Reenviado!','Se subió de nuevo a la misma carpeta. Verifica que ya estén todas las fotos.', true);
    setTimeout(()=>{ ov.classList.remove('on'); render(); }, 2200);
  }catch(err){
    setMsg('No se pudo reenviar','Revisa tu conexión e inténtalo otra vez. '+(err&&err.message||''),'err');
    setTimeout(()=>ov.classList.remove('on'), 3500);
  }
}

async function borrar(id){
  const l=getLev(id);
  if(!l) return;
  const archivos=(l.medios||[]).length;
  const detalle = archivos ? '\n\nSe eliminarán también '+archivos+
    (archivos===1?' archivo':' archivos')+' del teléfono.' : '';
  const aviso = l.enviado
    ? '\n\nYa fue enviado, así que lo de Drive no se toca.'
    : '\n\n⚠️ Este levantamiento NO se ha enviado. Se pierde todo lo capturado.';
  if(!confirm('¿Eliminar '+l.folio+'?'+aviso+detalle)) return;
  if(!l.enviado && !confirm('Confirma otra vez: se borra definitivamente y no se puede recuperar.')) return;
  await borrarLev(id);
  render();
}

function abrir(id){
  sessionStorage.setItem('mdk_id', id);
  const l=getLev(id);
  window.location.href = (l && l.pasoSitio) ? 'evidencias.html' : 'sitio.html';
}

function previewFolio(){
  const p=document.getElementById('m_proyecto').value.trim();
  document.getElementById('folioPrev').textContent =
    p ? 'LEV-'+siglas(p)+'-'+String(prevConsec(p)).padStart(3,'0') : 'LEV-XXX-001';

  // botón de reiniciar: solo si el proyecto ya arrastra consecutivo
  // pero no quedan levantamientos de ese prefijo (todos borrados/enviados-y-borrados)
  const btn=document.getElementById('resetFolioBtn');
  if(!p){ btn.style.display='none'; return; }
  const pre=siglas(p);
  let cont={}; try{ cont=JSON.parse(localStorage.getItem('mdk_folios')||'{}'); }catch(e){}
  const vivos=getLevs().filter(l=>l.prefijo===pre).length;
  if((cont[pre]||0)>0 && vivos===0){
    btn.style.display='block';
    btn.textContent='↺ Reiniciar folio de este proyecto a 001';
  } else {
    btn.style.display='none';
  }
}
function reiniciar(){
  const p=document.getElementById('m_proyecto').value.trim();
  if(!p) return;
  const pre=siglas(p);
  const r=reiniciarFolio(pre);
  if(!r.ok){
    alert('No se puede reiniciar: todavía hay '+r.quedan+' levantamiento(s) de este proyecto en la lista. '+
          'Elimínalos o envíalos y elimínalos primero.');
    return;
  }
  previewFolio();
  alert('Listo. El próximo folio de '+pre+' será 001.');
}
/* solo para mostrar: no consume el consecutivo */
function prevConsec(proyecto){
  const pre=siglas(proyecto);
  let c={}; try{ c=JSON.parse(localStorage.getItem('mdk_folios')||'{}'); }catch(e){}
  return Math.max(c[pre]||0, getLevs().filter(l=>l.prefijo===pre).length)+1;
}

function abrirModal(){
  document.getElementById('mErr').textContent='';
  if(!document.getElementById('m_fecha').value)
    document.getElementById('m_fecha').value=new Date().toISOString().slice(0,10);
  previewFolio();
  document.getElementById('ov').classList.add('open');
}
function cerrarModal(){ document.getElementById('ov').classList.remove('open'); }

function crear(){
  const proyecto=document.getElementById('m_proyecto').value.trim().toUpperCase();
  const sitio=document.getElementById('m_sitio').value.trim();
  const capturadoPor=document.getElementById('m_capturado').value.trim();
  const fecha=document.getElementById('m_fecha').value;
  const err=document.getElementById('mErr');

  if(!proyecto || !sitio || !capturadoPor){
    err.textContent='Proyecto, sitio y quien captura son obligatorios.'; return;
  }
  const lev=crearLev({proyecto, sitio, capturadoPor, fecha});
  if(!guardarLev(lev)) return;
  sessionStorage.setItem('mdk_id', lev.id);
  window.location.href='sitio.html';
}

/* ---------- instalar como app ---------- */
let promptInstalar = null;
const yaInstalada = window.matchMedia('(display-mode: standalone)').matches ||
                    window.navigator.standalone === true;

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  promptInstalar = e;
  if(!yaInstalada) document.getElementById('instBtn').style.display = 'inline-flex';
});
window.addEventListener('appinstalled', () => {
  promptInstalar = null;
  document.getElementById('instBtn').style.display = 'none';
});

function esIOS(){ return /iphone|ipad|ipod/i.test(navigator.userAgent); }

async function instalar(){
  if(promptInstalar){
    promptInstalar.prompt();
    await promptInstalar.userChoice;
    promptInstalar = null;
    document.getElementById('instBtn').style.display = 'none';
    return;
  }
  if(esIOS()){
    alert('Para instalarla en iPhone:\n\n1. Toca el botón Compartir (el cuadro con la flecha hacia arriba)\n2. Baja y elige "Agregar a pantalla de inicio"\n3. Toca Agregar');
  } else {
    alert('Para instalarla:\n\n1. Abre el menú del navegador (los 3 puntos ⋮)\n2. Elige "Instalar aplicación" o "Agregar a pantalla de inicio"');
  }
}

/* en iPhone no existe el aviso automático: se muestra siempre */
if(esIOS() && !yaInstalada){
  window.addEventListener('load', ()=>{
    document.getElementById('instBtn').style.display='inline-flex';
  });
}

let editId = null;
function editar(id){
  const l=getLev(id); if(!l) return;
  editId=id;
  document.getElementById('editFolio').textContent = l.folio;
  document.getElementById('e_proyecto').value = l.proyecto||'';
  document.getElementById('e_sitio').value = l.sitio||'';
  document.getElementById('e_capturado').value = l.capturadoPor||'';
  document.getElementById('e_fecha').value = l.fecha||'';
  document.getElementById('e_folioAviso').textContent =
    l.enviado ? 'Ya fue enviado: el folio no cambia para no afectar lo que está en Drive.'
              : 'Si cambias las 3 primeras letras del proyecto, el folio se regenera.';
  document.getElementById('eErr').textContent='';
  document.getElementById('ovEdit').classList.add('open');
}
function cerrarEdit(){ document.getElementById('ovEdit').classList.remove('open'); editId=null; }

function guardarEdit(){
  const l=getLev(editId); if(!l){ cerrarEdit(); return; }
  const proyecto=document.getElementById('e_proyecto').value.trim().toUpperCase();
  const sitio=document.getElementById('e_sitio').value.trim();
  const capturado=document.getElementById('e_capturado').value.trim();
  const fecha=document.getElementById('e_fecha').value;
  if(!proyecto || !sitio || !capturado){
    document.getElementById('eErr').textContent='Proyecto, sitio y quien captura son obligatorios.'; return;
  }

  // Si cambia el prefijo del proyecto y NO se ha enviado, se regenera el folio
  const nuevoPre = siglas(proyecto);
  if(!l.enviado && nuevoPre !== l.prefijo){
    const f = nuevoFolio(proyecto);
    l.folio = f.folio; l.prefijo = f.prefijo; l.consec = f.consec;
    // renombrar los archivos guardados para que coincidan con el folio nuevo
    (l.medios||[]).forEach(m=>{
      if(m.name) m.name = m.name.replace(/(LEV-[A-Z0-9]+-\d{3})/, l.folio);
    });
  }
  l.proyecto=proyecto; l.sitio=sitio; l.capturadoPor=capturado; l.fecha=fecha;
  guardarLev(l);
  recalcularContadores();
  cerrarEdit();
  render();
}

async function probar(){
  const b=document.getElementById('testBtn');
  b.textContent='Probando…'; b.disabled=true;
  const r=await probarConexion();
  b.disabled=false; b.textContent='Probar conexión con Drive';
  alert((r.ok?'✅ Conexión correcta\n\n':'❌ Todavía no funciona\n\n')+r.msg);
}

if(LOGO) document.getElementById('brandLogo').innerHTML='<img src="'+LOGO+'" alt="MD">';
window.addEventListener('online', render);
window.addEventListener('offline', render);
render();
</script>
</body>
</html>
