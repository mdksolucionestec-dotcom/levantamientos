<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1080">
<title>MDreieck Campo</title>
<link rel="stylesheet" href="estilos.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<header class="hdr plain">
  <div class="hdr-row">
    <div class="logo" id="brandLogo">MD</div>
    <div class="htxt">
      <h1>MDreieck Campo</h1>
      <div class="sub">Levantamientos de sitio</div>
    </div>
  </div>
</header>

<main class="wrap">
  <div id="banners"></div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:13px">
    <span class="chip" id="countChip">—</span>
    <button class="btn btn-ghost" style="padding:9px 13px;font-size:13px" onclick="abrirModal()">＋ Nuevo</button>
  </div>
  <div class="list" id="list"></div>
</main>

<nav class="navbar">
  <div class="nav-inner">
    <button class="btn btn-primary btn-block" onclick="abrirModal()">＋ Nuevo levantamiento</button>
    <button class="link-test" id="testBtn" onclick="probar()">Probar conexión con Drive</button>
  </div>
</nav>

<div class="overlay" id="ov" onclick="if(event.target===this)cerrarModal()">
  <div class="sheet" role="dialog" aria-modal="true">
    <div class="grab"></div>
    <h2>Nuevo levantamiento</h2>
    <p class="sh-sub">Funciona sin internet. El folio se genera al instante.</p>

    <div class="field">
      <label>Proyecto</label>
      <input id="m_proyecto" placeholder="Ej. VERACRUZ" autocomplete="off"
             style="text-transform:uppercase" oninput="previewFolio()">
    </div>
    <div class="folio-prev" id="folioPrev">LEV-XXX-001</div>

    <div class="field">
      <label>Nombre del sitio / localidad</label>
      <input id="m_sitio" placeholder="Ej. Col. Centro, Poza Rica" autocomplete="off">
    </div>
    <div class="field">
      <label>Nombre de quien captura</label>
      <input id="m_capturado" placeholder="Nombre completo" autocomplete="off">
    </div>
    <div class="field">
      <label>Fecha de captura</label>
      <input id="m_fecha" type="date">
    </div>

    <div class="err" id="mErr"></div>
    <div class="sheet-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="cerrarModal()">Cancelar</button>
      <button class="btn btn-primary" style="flex:1.4" onclick="crear()">Crear y continuar</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
<script>
function nFotos(l){ return (l.medios||[]).filter(m=>m.kind==='foto').length; }
function nVideos(l){ return (l.medios||[]).filter(m=>m.kind==='video').length; }

function renderBanners(){
  const c=document.getElementById('banners');
  const pend=getLevs().filter(l=>!l.enviado && l.listoParaEnviar).length;
  let h='';
  if(!online()){
    h=`<div class="banner info"><span class="b-ic">📴</span>
      <span>Modo sin conexión. Crea y captura con normalidad: solo el envío a Drive necesita internet.</span></div>`;
  } else if(pend>0){
    h=`<div class="banner pend"><span class="b-ic">🔄</span>
      <span>${pend} ${pend===1?'levantamiento listo':'levantamientos listos'} sin enviar.</span></div>`;
  } else if(!CONFIGURADO){
    h=`<div class="banner info"><span class="b-ic">⚙️</span>
      <span>Falta configurar la URL del Apps Script en app.js. Todo funciona, pero aún no sube a Drive.</span></div>`;
  }
  c.innerHTML=h;
}

function render(){
  renderBanners();
  const levs=getLevs();
  const list=document.getElementById('list');
  document.getElementById('countChip').textContent =
    levs.length+' '+(levs.length===1?'levantamiento':'levantamientos');

  if(!levs.length){
    list.innerHTML=`<div class="empty"><div class="em-ic">📍</div>
      <h3>Sin levantamientos</h3><p>Crea el primero con el botón de abajo.</p></div>`;
    return;
  }
  const orden=levs.slice().sort((a,b)=>(b.creado||'').localeCompare(a.creado||''));
  list.innerHTML=orden.map(l=>{
    const badge = l.enviado ? '<span class="badge badge-sent">✓ Enviado</span>'
      : (l.listoParaEnviar ? '<span class="badge badge-pend">Por enviar</span>'
                           : '<span class="badge badge-cap">En captura</span>');
    return `<div class="item" onclick="abrir('${l.id}')">
      <div class="it-body">
        <div class="it-folio">${esc(l.folio)}</div>
        <div class="it-sitio">${esc(l.sitio||l.proyecto||'—')}</div>
        <div class="it-meta"><span>👤 ${esc(l.capturadoPor||'—')}</span>
          <span>📅 ${fmtFecha(l.fecha)}</span></div>
      </div>
      <div class="it-side">${badge}
        <span class="chip">📷 ${nFotos(l)} · 🎥 ${nVideos(l)}</span></div>
      <button class="del-lev" aria-label="Eliminar"
        onclick="event.stopPropagation(); borrar('${l.id}')">🗑</button>
    </div>`;
  }).join('');
}

async function borrar(id){
  const l=getLev(id);
  if(!l) return;
  const archivos=(l.medios||[]).length;
  const detalle = archivos ? '\n\nSe eliminarán también '+archivos+
    (archivos===1?' archivo':' archivos')+' del teléfono.' : '';
  const aviso = l.enviado
    ? '\n\nYa fue enviado, así que lo de Drive no se toca.'
    : '\n\n⚠️ Este levantamiento NO se ha enviado. Se pierde todo lo capturado.';
  if(!confirm('¿Eliminar '+l.folio+'?'+aviso+detalle)) return;
  if(!l.enviado && !confirm('Confirma otra vez: se borra definitivamente y no se puede recuperar.')) return;
  await borrarLev(id);
  render();
}

function abrir(id){
  sessionStorage.setItem('mdk_id', id);
  const l=getLev(id);
  window.location.href = (l && l.pasoSitio) ? 'evidencias.html' : 'sitio.html';
}

function previewFolio(){
  const p=document.getElementById('m_proyecto').value.trim();
  document.getElementById('folioPrev').textContent =
    p ? 'LEV-'+siglas(p)+'-'+String(prevConsec(p)).padStart(3,'0') : 'LEV-XXX-001';
}
/* solo para mostrar: no consume el consecutivo */
function prevConsec(proyecto){
  const pre=siglas(proyecto);
  let c={}; try{ c=JSON.parse(localStorage.getItem('mdk_folios')||'{}'); }catch(e){}
  return Math.max(c[pre]||0, getLevs().filter(l=>l.prefijo===pre).length)+1;
}

function abrirModal(){
  document.getElementById('mErr').textContent='';
  if(!document.getElementById('m_fecha').value)
    document.getElementById('m_fecha').value=new Date().toISOString().slice(0,10);
  previewFolio();
  document.getElementById('ov').classList.add('open');
}
function cerrarModal(){ document.getElementById('ov').classList.remove('open'); }

function crear(){
  const proyecto=document.getElementById('m_proyecto').value.trim().toUpperCase();
  const sitio=document.getElementById('m_sitio').value.trim();
  const capturadoPor=document.getElementById('m_capturado').value.trim();
  const fecha=document.getElementById('m_fecha').value;
  const err=document.getElementById('mErr');

  if(!proyecto || !sitio || !capturadoPor){
    err.textContent='Proyecto, sitio y quien captura son obligatorios.'; return;
  }
  const lev=crearLev({proyecto, sitio, capturadoPor, fecha});
  if(!guardarLev(lev)) return;
  sessionStorage.setItem('mdk_id', lev.id);
  window.location.href='sitio.html';
}

async function probar(){
  const b=document.getElementById('testBtn');
  b.textContent='Probando…'; b.disabled=true;
  const r=await probarConexion();
  b.disabled=false; b.textContent='Probar conexión con Drive';
  alert((r.ok?'✅ Conexión correcta\n\n':'❌ Todavía no funciona\n\n')+r.msg);
}

if(LOGO) document.getElementById('brandLogo').innerHTML='<img src="'+LOGO+'" alt="MD">';
window.addEventListener('online', render);
window.addEventListener('offline', render);
render();
</script>
</body>
</html>
