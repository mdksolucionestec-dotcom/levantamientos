<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1080">
<title>Evidencias</title>
<link rel="stylesheet" href="estilos.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
<header class="hdr">
  <div class="hdr-row">
    <button class="back" onclick="atras()" aria-label="Atrás">‹</button>
    <div class="htxt">
      <h1>Evidencias</h1>
      <div class="sub" id="hSub">—</div>
    </div>
  </div>
  <div class="prog">
    <div class="pstep done"><div class="pbar"></div><div class="plabel">Datos del sitio</div></div>
    <div class="pstep on"><div class="pbar"></div><div class="plabel">Evidencias</div></div>
  </div>
</header>

<main class="wrap">
  <div id="banners"></div>

  <div class="card">
    <h2><span class="ic">📸</span>Fotos y videos<span class="n" id="medCount">0</span></h2>
    <p class="hint">Cada archivo lleva su propio comentario o especificación.</p>
    <div class="cap-btns">
      <button class="pill" onclick="document.getElementById('inp-foto').click()">
        <span class="p-ic">📷</span><span>Tomar foto</span></button>
      <button class="pill" onclick="document.getElementById('inp-video').click()">
        <span class="p-ic">🎥</span><span>Grabar video</span></button>
      <button class="pill" onclick="document.getElementById('inp-subir').click()">
        <span class="p-ic">📁</span><span>Subir archivo</span></button>
    </div>
    <div class="medios" id="medios"></div>
  </div>

  <div class="card">
    <h2><span class="ic">📝</span>Notas y comentarios adicionales</h2>
    <div class="field">
      <textarea id="notas" placeholder="Observaciones generales del levantamiento…"
        oninput="setNotas(this.value)"></textarea>
    </div>
  </div>
</main>

<input class="hidden-input" type="file" accept="image/*" capture="environment" id="inp-foto" onchange="capFoto(this)">
<input class="hidden-input" type="file" accept="video/*" capture="environment" id="inp-video" onchange="capVideo(this)">
<input class="hidden-input" type="file" accept="image/*,video/*" multiple id="inp-subir" onchange="capMixto(this)">

<nav class="navbar">
  <div class="nav-inner">
    <button class="btn btn-send btn-block" id="sendBtn" onclick="enviar()">📤 Enviar a Drive</button>
    <div class="nav-sec">
      <button class="btn btn-ghost" onclick="atras()">‹ Datos del sitio</button>
      <button class="btn btn-ghost" onclick="verPDF()">📄 Ver PDF</button>
    </div>
  </div>
</nav>

<div class="sending" id="sendOv">
  <div class="send-box" id="sendBox">
    <div class="spin"></div>
    <div class="check-ic" id="checkIc">✓</div>
    <h3 id="sendTitle">Procesando…</h3>
    <p id="sendMsg">Un momento.</p>
  </div>
</div>

<script src="app.js"></script>
<script>
const id = sessionStorage.getItem('mdk_id');
let lev = getLev(id);
if(!lev){ window.location.href='index.html'; }
const urls = {};

function renderBanners(){
  const c=document.getElementById('banners');
  let h='';
  if(!online()){
    h=`<div class="banner off"><span class="b-ic">⚠️</span>
      <span>Sin conexión. Captura con normalidad; el envío queda pendiente hasta que haya señal.</span></div>`;
  } else if(lev.listoParaEnviar && !lev.enviado){
    h=`<div class="banner pend"><span class="b-ic">🔄</span>
      <span>Este levantamiento quedó pendiente de envío. Ya hay señal: pulsa "Enviar a Drive".</span></div>`;
  } else if(lev.enviado){
    h=`<div class="banner info"><span class="b-ic">✓</span>
      <span>Enviado el ${fmtFecha((lev.fechaEnvio||'').slice(0,10))}. Puedes volver a enviarlo si agregas algo.</span></div>`;
  }
  c.innerHTML=h;
}

/* ---------- captura ---------- */
function contarKind(k){ return (lev.medios||[]).filter(m=>m.kind===k).length; }

async function agregar(kind, blob, mimeType){
  const mid='m_'+Date.now()+'_'+Math.random().toString(36).slice(2,7);
  try{ await idbPut({id:mid, levId:lev.id, blob}); }
  catch(e){ alert('No se pudo guardar el archivo en el teléfono.'); return; }
  const n=contarKind(kind)+1;
  const ext = kind==='foto' ? 'jpg' : (String(mimeType).indexOf('quicktime')>=0 ? 'mov':'mp4');
  lev.medios=lev.medios||[];
  lev.medios.push({ id:mid, kind, mimeType, size:blob.size, comentario:'',
    ts:new Date().toISOString(),
    name:(kind==='foto'?'Foto_':'Video_')+String(n).padStart(2,'0')+'_'+lev.folio+'.'+ext });
  guardarLev(lev);
}

async function procesarArchivo(file){
  if(String(file.type).indexOf('video')===0){
    if(file.size > 40*1024*1024 &&
       !confirm('El video pesa '+fmtSize(file.size)+'. Los videos muy grandes pueden fallar al subir. ¿Continuar?')) return;
    await agregar('video', file, file.type||'video/mp4');
  } else {
    const blob = await comprimirFoto(file);
    if(blob) await agregar('foto', blob, 'image/jpeg');
  }
}
async function capFoto(input){ await procesarLista(input); }
async function capVideo(input){ await procesarLista(input); }
async function capMixto(input){ await procesarLista(input); }

async function procesarLista(input){
  const files=Array.from(input.files||[]);
  if(!files.length) return;
  mostrar('Guardando…','Procesando '+files.length+(files.length===1?' archivo.':' archivos.'));
  for(const f of files){ await procesarArchivo(f); }
  input.value='';
  ocultar();
  renderMedios();
}

async function eliminar(mid){
  if(!confirm('¿Eliminar este archivo?')) return;
  try{ await idbDel(mid); }catch(e){}
  if(urls[mid]){ URL.revokeObjectURL(urls[mid]); delete urls[mid]; }
  lev.medios=(lev.medios||[]).filter(m=>m.id!==mid);
  guardarLev(lev); renderMedios();
}
function setComentario(mid,v){
  const m=(lev.medios||[]).find(x=>x.id===mid);
  if(m){ m.comentario=v; guardarLev(lev); }
}
function setNotas(v){ lev.notas=v; guardarLev(lev); }

async function renderMedios(){
  const cont=document.getElementById('medios');
  const meds=lev.medios||[];
  document.getElementById('medCount').textContent =
    contarKind('foto')+' 📷 · '+contarKind('video')+' 🎥';
  if(!meds.length){
    cont.innerHTML='<div class="sin-medios">Aún no hay fotos ni videos.<br>Usa los botones de arriba.</div>';
    return;
  }
  const partes=[];
  for(const m of meds){
    if(!urls[m.id]){
      const rec=await idbGet(m.id);
      urls[m.id]= rec && rec.blob ? URL.createObjectURL(rec.blob) : '';
    }
    const vista = m.kind==='foto'
      ? `<img src="${urls[m.id]}" alt="">`
      : `<video src="${urls[m.id]}" controls preload="metadata" playsinline></video>`;
    partes.push(`<div class="medio">
      <div class="medio-top">${vista}
        <span class="medio-tag">${m.kind==='foto'?'📷 Foto':'🎥 Video'}</span>
        <button class="medio-del" onclick="eliminar('${m.id}')" aria-label="Eliminar">✕</button>
      </div>
      <div class="medio-body">
        <textarea placeholder="Comentario o especificación de este archivo…"
          oninput="setComentario('${m.id}',this.value)">${esc(m.comentario)}</textarea>
        <div class="medio-info"><span>${esc(m.name)}</span><span>${fmtSize(m.size||0)}</span></div>
      </div>
    </div>`);
  }
  cont.innerHTML=partes.join('');
}

/* ---------- overlay ---------- */
function mostrar(t,m,estado){
  const box=document.getElementById('sendBox');
  box.classList.toggle('done', !!estado);
  const ic=document.getElementById('checkIc');
  ic.textContent = estado==='err' ? '⚠️' : '✓';
  ic.style.color = estado==='err' ? '#c62828' : '#1f9d55';
  document.getElementById('sendTitle').textContent=t;
  document.getElementById('sendMsg').textContent=m;
  document.getElementById('sendOv').classList.add('on');
}
function ocultar(){ document.getElementById('sendOv').classList.remove('on'); }

/* ---------- PDF ---------- */
async function verPDF(){
  mostrar('Generando PDF…','Carátula, datos y fotos.');
  try{
    const doc=await generarPDF(lev, mostrar);
    if(doc) doc.save(nombrePDF(lev));
  }catch(e){ mostrar('No se pudo generar','('+(e.message||e)+')','err'); setTimeout(ocultar,3000); return; }
  ocultar();
}

/* ---------- envío ---------- */
async function enviar(){
  if(!(lev.medios||[]).length &&
     !confirm('No hay fotos ni videos. ¿Enviar de todas formas?')) return;

  if(!online()){
    lev.listoParaEnviar=true; guardarLev(lev); renderBanners();
    mostrar('Guardado en el teléfono',
      'Queda como "Por enviar". Cuando tengas internet, ábrelo y pulsa Enviar a Drive.', true);
    setTimeout(ocultar,3400);
    return;
  }
  const btn=document.getElementById('sendBtn'); btn.disabled=true;
  try{
    await enviarLev(lev, mostrar);
    lev.enviado=true; lev.listoParaEnviar=false; lev.fechaEnvio=new Date().toISOString();
    guardarLev(lev);
    mostrar('¡Enviado!', CONFIGURADO
      ? 'Carpeta creada en Drive con el reporte PDF, las fotos y los videos.'
      : 'PDF descargado. Falta configurar la URL del Apps Script para subir a Drive.', true);
    setTimeout(()=>{ window.location.href='index.html'; }, 2300);
  }catch(err){
    lev.listoParaEnviar=true; guardarLev(lev);
    mostrar('No se pudo enviar',
      'Quedó guardado como pendiente y el PDF se descargó en el teléfono. '+(err&&err.message||''),'err');
    btn.disabled=false;
    setTimeout(ocultar,4200);
  }
}

function atras(){ guardarLev(lev); window.location.href='sitio.html'; }

document.getElementById('hSub').textContent = lev.folio+'  ·  '+(lev.sitio||'');
document.getElementById('notas').value = lev.notas||'';
window.addEventListener('online', renderBanners);
window.addEventListener('offline', renderBanners);
window.addEventListener('beforeunload', ()=>{ Object.values(urls).forEach(u=>u&&URL.revokeObjectURL(u)); });
renderBanners();
renderMedios();
</script>
</body>
</html>
